name: Build Hawwil APK

env:
  APP_URL: https://hawwil.nexa-ps.com/
  ICON_URL: https://hawwil.nexa-ps.com/icon-v3-192.png
  APP_NAME: حوّل
  APP_ID: com.nexa.hawwil
  APK_NAME: Hawwil.apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Android project
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -e
          mkdir -p proj/app/src/main/java/com/nexa/hawwil proj/app/src/main/res/mipmap-xxxhdpi
          cd proj
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Hawwil"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.1' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nexa.hawwil'
              compileSdk 36

              defaultConfig {
                  applicationId '__APP_ID__'
                  minSdk 24
                  targetSdk 36
                  versionCode __VCODE__
                  versionName '1.__VCODE__'
              }

              signingConfigs {
                  release {
                      storeFile file('app.keystore')
                      storePassword 'hawwil123'
                      keyAlias 'hawwil'
                      keyPassword 'hawwil123'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="__APP_NAME__"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:enableOnBackInvokedCallback="false"
                  android:usesCleartextTraffic="false"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/nexa/hawwil/MainActivity.java <<'EOF'
          package com.nexa.hawwil;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private static final String HOME = "__APP_URL__";
              private static final String HOST = "hawwil.nexa-ps.com";
              private WebView web;

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  android.widget.FrameLayout root = new android.widget.FrameLayout(this);
                  root.setBackgroundColor(0xFF0F1C2E);
                  web = new WebView(this);
                  root.addView(web, new android.widget.FrameLayout.LayoutParams(-1, -1));
                  setContentView(root);
                  root.setOnApplyWindowInsetsListener(new android.view.View.OnApplyWindowInsetsListener() {
                      @Override
                      public android.view.WindowInsets onApplyWindowInsets(android.view.View v, android.view.WindowInsets i) {
                          v.setPadding(i.getSystemWindowInsetLeft(), i.getSystemWindowInsetTop(), i.getSystemWindowInsetRight(), i.getSystemWindowInsetBottom());
                          return i;
                      }
                  });
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          return handle(r.getUrl());
                      }

                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame()) {
                              String html = "<html dir='rtl'><body style='font-family:sans-serif;text-align:center;padding:48px 24px;color:#0f1c2e'>"
                                      + "<h2>حوّل</h2>"
                                      + "<p>لازم إنترنت أول مرة بس. بعدها بيشتغل بدون إنترنت.</p>"
                                      + "<p><a href='" + HOME + "'>أعد المحاولة</a></p></body></html>";
                              v.loadDataWithBaseURL(HOME, html, "text/html", "UTF-8", null);
                          }
                      }
                  });
                  if (saved != null) {
                      web.restoreState(saved);
                  } else {
                      web.loadUrl(HOME);
                  }
              }

              private boolean handle(Uri u) {
                  String scheme = u.getScheme() == null ? "" : u.getScheme();
                  if ((scheme.equals("https") || scheme.equals("http")) && HOST.equals(u.getHost())) {
                      return false;
                  }
                  Intent i;
                  if (scheme.equals("tel")) {
                      i = new Intent(Intent.ACTION_DIAL, u);
                  } else {
                      i = new Intent(Intent.ACTION_VIEW, u);
                  }
                  try {
                      startActivity(i);
                  } catch (ActivityNotFoundException e) {
                      // nothing can open this link
                  }
                  return true;
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF
          curl -fsSL "$ICON_URL" -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo "$KEYSTORE_B64" | base64 -d > app/app.keystore
          sed -i "s|__APP_URL__|$APP_URL|g" app/src/main/java/com/nexa/hawwil/MainActivity.java
          sed -i "s|__APP_NAME__|$APP_NAME|g" app/src/main/AndroidManifest.xml
          sed -i "s|__APP_ID__|$APP_ID|g; s|__VCODE__|$GITHUB_RUN_NUMBER|g" app/build.gradle

      - name: Build
        working-directory: proj
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Rename APK and AAB
        run: |
          cp proj/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          cp proj/app/build/outputs/bundle/release/app-release.aab Hawwil.aab

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: حوّل v${{ github.run_number }}
          files: |
            ${{ env.APK_NAME }}
            Hawwil.aab
          make_latest: true
